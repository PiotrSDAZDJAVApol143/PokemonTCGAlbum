  - changeSet:
      id: 19c_fix_allow_null_attack_def
      author: piotr
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "1"
            sql: |
              SELECT CASE WHEN EXISTS (
                SELECT 1
                FROM INFORMATION_SCHEMA.COLUMNS
                WHERE TABLE_SCHEMA = DATABASE()
                  AND TABLE_NAME = 'attack'
                  AND COLUMN_NAME = 'def_id'
                  AND IS_NULLABLE = 'NO'
              ) THEN '1' ELSE '0' END
      changes:
        - dropNotNullConstraint:
            tableName: attack
            columnName: def_id
            columnDataType: BIGINT

  - changeSet:
      id: 19d_fix_allow_null_ability_def
      author: piotr
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "1"
            sql: |
              SELECT CASE WHEN EXISTS (
                SELECT 1
                FROM INFORMATION_SCHEMA.COLUMNS
                WHERE TABLE_SCHEMA = DATABASE()
                  AND TABLE_NAME = 'ability'
                  AND COLUMN_NAME = 'def_id'
                  AND IS_NULLABLE = 'NO'
              ) THEN '1' ELSE '0' END
      changes:
        - dropNotNullConstraint:
            tableName: ability
            columnName: def_id
            columnDataType: BIGINT
  - changeSet:
      id: 19e_zero_to_null_attack_def
      author: piotr
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "1"
            sql: "SELECT CASE WHEN EXISTS (SELECT 1 FROM attack WHERE def_id = 0) THEN 1 ELSE 0 END"
      changes:
        - sql:
            sql: "UPDATE attack SET def_id = NULL WHERE def_id = 0"

  - changeSet:
