  - changeSet:
      id: 21_make_def_id_not_null
      author: piotr
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT COUNT(*) FROM attack WHERE def_id IS NULL OR def_id = 0"
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT COUNT(*) FROM ability WHERE def_id IS NULL OR def_id = 0"
      changes:
        - addNotNullConstraint:
            tableName: attack
            columnName: def_id
            columnDataType: BIGINT
        - addNotNullConstraint:
            tableName: ability
            columnName: def_id
            columnDataType: BIGINT
