  - changeSet:
      id: 20a_fk_attack_def
      author: piotr
      preConditions:
        - onFail: HALT
        - not:
            foreignKeyConstraintExists:
              foreignKeyName: fk_attack_def
        - sqlCheck:
            expectedResult: "0"
            sql: |
              SELECT COUNT(*)
              FROM attack a
              LEFT JOIN attack_def d ON d.id = a.def_id
              WHERE a.def_id IS NOT NULL
                AND a.def_id <> 0
                AND d.id IS NULL
      changes:
        - addForeignKeyConstraint:
            baseTableName: attack
            baseColumnNames: def_id
            referencedTableName: attack_def
            referencedColumnNames: id
            constraintName: fk_attack_def
            onDelete: RESTRICT

  - changeSet:
      id: 20b_fk_ability_def
      author: piotr
      preConditions:
        - onFail: HALT
        - not:
            foreignKeyConstraintExists:
              foreignKeyName: fk_ability_def
        - sqlCheck:
            expectedResult: "0"
            sql: |
              SELECT COUNT(*)
              FROM ability ab
              LEFT JOIN ability_def d ON d.id = ab.def_id
              WHERE ab.def_id IS NOT NULL
                AND ab.def_id <> 0
                AND d.id IS NULL
      changes:
        - addForeignKeyConstraint:
            baseTableName: ability
            baseColumnNames: def_id
            referencedTableName: ability_def
            referencedColumnNames: id
