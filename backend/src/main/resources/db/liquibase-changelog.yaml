            columns:
              - column: { name: id, type: BIGINT AUTO_INCREMENT, constraints: { primaryKey: true } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: name_pl, type: VARCHAR(255) }
              - column: { name: description, type: VARCHAR(1000) }
              - column: { name: description_pl, type: VARCHAR(1000) }
              - column: { name: canonical_key, type: VARCHAR(512), constraints: { nullable: false } }
              - column: { name: rating, type: INT }
        - addUniqueConstraint:
            tableName: rule_def
            columnNames: canonical_key
            constraintName: uq_rule_def_canonical
  - changeSet:
