  - changeSet:
      id: 17_create_table_attack_ability_def
      author: piotr
      changes:
        - sqlFile:
            path: scripts/17_create_table_attack_ability_def.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  - changeSet:
      id: 17b_alter_attack_def_add_damage
      author: piotr
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: attack_def
              columnName: damage_text
      changes:
        - addColumn:
            tableName: attack_def
            columns:
              - column:
                  name: damage_text
                  type: VARCHAR(32)

  - changeSet:
      id: 17c_widen_attack_def_canonical_key
      author: piotr
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "1"
            sql: "SELECT CASE WHEN (SELECT CHARACTER_MAXIMUM_LENGTH FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME='attack_def' AND COLUMN_NAME='canonical_key') < 512 THEN 1 ELSE 0 END"
      changes:
        - modifyDataType:
            tableName: attack_def
            columnName: canonical_key
            newDataType: VARCHAR(512)

  - changeSet:
      id: 17d_recreate_uq_attack_def_canonical
      author: piotr
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        # wykonaj tylko, jeśli faktycznie istnieje constraint/indeks o tej nazwie
        - or:
            - uniqueConstraintExists:
                tableName: attack_def
                constraintName: uq_attack_def_canonical
            - indexExists:
                tableName: attack_def
                indexName: uq_attack_def_canonical
      changes:
        - dropUniqueConstraint:
            tableName: attack_def
            constraintName: uq_attack_def_canonical
        - addUniqueConstraint:
            tableName: attack_def
            columnNames: canonical_key
            constraintName: uq_attack_def_canonical
